model:
  name_or_path: "Qwen/Qwen2.5-Coder-3B-Instruct"
  max_seq_length: 2048      # Porté à 2048 pour capturer les fonctions C/C++ complètes
  load_in_4bit: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "/content/drive/MyDrive/outputs/qwen-security"
  dataset_name: "mahdin70/balanced_merged_bigvul_primevul"
  per_device_train_batch_size: 4  # 4 pour préserver la VRAM T4 avec max_seq_length=2048
  gradient_accumulation_steps: 4  # Batch effectif global = 16 (4x4)
  learning_rate: 2.0e-4
  num_train_epochs: 1
  logging_steps: 10
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  bf16: false
  fp16: true