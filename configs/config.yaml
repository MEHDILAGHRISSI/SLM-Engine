model:
  name_or_path: "Qwen/Qwen2.5-Coder-3B-Instruct"
  max_seq_length: 1024  # <--- Changed from 2048 to 1024 (2.5x speedup)
  load_in_4bit: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

loraplus:
  enabled: true
  lr_ratio: 16.0

training:
  output_dir: "outputs/qwen-crossvul-loraplus"
  dataset_name: "hitoshura25/crossvul"
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  num_train_epochs: 2  # <--- Changed from 3 to 2 epochs
  logging_steps: 10
  save_strategy: "epoch"
  bf16: false
  fp16: true