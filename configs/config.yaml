model:
  name_or_path: "Qwen/Qwen2.5-Coder-3B-Instruct"
  max_seq_length: 1024
  load_in_4bit: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

loraplus:
  enabled: true
  lr_ratio: 16.0

training:
  output_dir: "outputs/qwen-crossvul-loraplus"
  dataset_name: "hitoshura25/crossvul"
  per_device_train_batch_size: 8   # <--- Passé de 4 à 8 (gain de vitesse sur GPU T4)
  gradient_accumulation_steps: 2   # <--- Réduit à 2 pour conserver un batch effectif global de 16
  learning_rate: 1.0e-4
  num_train_epochs: 1              # <--- MODIFIÉ : 1 époque au lieu de 2 (~3h15 de run au lieu de ~6h50)
  logging_steps: 10
  save_strategy: "steps"          # <--- MODIFIÉ : Sauvegarde par étapes au lieu d'époque
  save_steps: 100                  # <--- AJOUTÉ : Sauvegarde un checkpoint tous les 100 steps
  save_total_limit: 2              # <--- AJOUTÉ : Garde uniquement les 2 plus récents (évite la saturation du disque)
  bf16: false
  fp16: true