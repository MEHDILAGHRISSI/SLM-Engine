model:
  base_model_id: "Qwen/Qwen2.5-Coder-3B-Instruct"
  max_seq_length: 2048
  load_in_4bit: true

lora:
  r: 16
  alpha: 32
  dropout: 0  # Optimized for Unsloth
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

dataset:
  hf_dataset_name: "hitoshura25/crossvul"
  target_languages: ["java", "python", "py", "javascript", "js", "go", "php", "c", "cpp"]
  max_char_length: 3000

training:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  max_steps: 300
  output_dir: "models_cache/qwen3b_security_lora"
  hf_repo_id: "YOUR_USERNAME/qwen2.5-coder-3b-security-agent"  # Replace with your HF username
